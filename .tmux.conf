# Start window numbering at 1 (not 0)
set -g base-index 1
setw -g pane-base-index 1

# Enable mouse support
set -g mouse on

# Increase history limit
set -g history-limit 10000

# 256 color support
set -g default-terminal "tmux-256color"
set-option -sa terminal-overrides ',xterm-256color:RGB'

# Vi keybindings for navigation
setw -g mode-keys vi

# Custom pane on open: horizontal split with 25% view in lower pane
set-hook -g session-created "run-shell 'tmux split-window -v -l \"15\" && tmux select-pane -t 1'"
bind c new-window \; split-window -v -l '15' \; select-pane -t 1
